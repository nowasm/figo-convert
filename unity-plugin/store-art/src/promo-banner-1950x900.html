<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1950px; height: 900px; position: relative;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .grid { background-size: 72px 72px; }
  .wrap { position: absolute; inset: 0; padding: 70px 0 70px 130px; display: flex; align-items: center; gap: 80px; }
  .left { width: 820px; flex: none; }
  .brandrow { display: flex; align-items: center; gap: 22px; margin-bottom: 40px; }
  .brandrow img { width: 96px; height: 96px; }
  .brandrow span { font-size: 34px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -.025em; line-height: 1.06; }
  h1 .grad-text { display: block; }
  .tag { margin-top: 30px; font-size: 31px; line-height: 1.45; color: #C7D3EC; }
  .tag b { color: var(--paper); }
  .flow { margin-top: 44px; display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 700; }
  .flow .chip { padding: 13px 28px; }
  .flow .arrow { color: var(--blue); font-size: 32px; }
  .flow .out { border-color: rgba(112,71,235,.6); background: rgba(112,71,235,.16); }
  .right { flex: 1; position: relative; margin-right: -110px; }
  .shot-frame { transform: rotate(1.2deg); }
  .shot { width: 100%; }
  .badge { position: absolute; left: -50px; bottom: -40px; transform: rotate(-1.5deg);
    display: flex; align-items: center; gap: 16px;
    background: rgba(17,27,48,.94); border: 1px solid rgba(35,205,184,.5);
    border-radius: 18px; padding: 20px 32px; font-size: 25px; font-weight: 700;
    box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  .badge .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--mint); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--grad); }
</style></head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="brandrow"><img src="assets/figo-mark.svg"><span>figo</span></div>
      <h1>Design to engine.<span class="grad-text">Pixel-identical.</span></h1>
      <div class="tag">Turn <b>Figma files &amp; HTML pages</b> into <b>ready-to-use game UI prefabs</b> — sprites baked, metadata generated, drop straight into your scene.</div>
      <div class="flow">
        <span class="chip mono">.fig</span>
        <span class="chip mono">HTML</span>
        <span class="arrow">→</span>
        <span class="chip mono out">.prefab</span>
      </div>
    </div>
    <div class="right">
      <div class="shot-frame"><img class="shot" src="assets/starfall_menu.web.png"></div>
      <div class="badge"><span class="dot"></span>1 : 1 with the design — every pixel</div>
    </div>
  </div>
  <div class="bar"></div>
</body></html>
